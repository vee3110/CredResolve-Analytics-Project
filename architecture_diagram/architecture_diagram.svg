<text x="48" y="544" font-family="Fraunces, serif" font-size="16" fill="#F2EFE6">Example data contract: golden_payments &#8594; metric_recovery_monthly</text>
<text x="48" y="570" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#E3A542">Primary key</text>
<text x="268" y="570" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#9FB3AB" text-anchor="start"><tspan x="268" dy="0">payment_sk (surrogate: payment_id + dup_seq)</tspan></text>
<text x="48" y="594" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#E3A542">Grain</text>
<text x="268" y="594" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#9FB3AB" text-anchor="start"><tspan x="268" dy="0">one row per payment event, post-dedup</tspan></text>
<text x="48" y="618" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#E3A542">Required fields</text>
<text x="268" y="618" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#9FB3AB" text-anchor="start"><tspan x="268" dy="0">account_id, amount, payment_status, event_at (non-null)</tspan></text>
<text x="48" y="642" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#E3A542">Freshness SLA</text>
<text x="268" y="642" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#9FB3AB" text-anchor="start"><tspan x="268" dy="0">GOLDEN refreshed within 2h of RAW landing</tspan></text>
<text x="48" y="666" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#E3A542">Breaking change rule</text>
<text x="268" y="666" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="400" fill="#9FB3AB" text-anchor="start"><tspan x="268" dy="0">any column rename/type change requires a new contract version, old version kept 90 days</tspan></text>
