<text x="48" y="280" font-size="11.5" fill="#9FB3AB">Orchestration: Airflow/dbt DAG, one task per stage &#8226; hourly RAW&#8594;GOLDEN, daily GOLDEN&#8594;DASHBOARD &#8226; each edge is a data contract with a schema check gate</text>
